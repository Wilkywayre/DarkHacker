name: deploy

# Manual only: Actions -> deploy -> Run workflow. Publishes the extension
# to the Chrome Web Store via the CWS Publish API v2.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   CWS_PUBLISHER_ID   publisher id, from publishers.list or the dev dashboard URL
#   CWS_ITEM_ID        32-char store item id from the dev dashboard URL
#   CWS_CLIENT_ID      Google Cloud OAuth client id (scope: .../auth/chromewebstore)
#   CWS_CLIENT_SECRET  Google Cloud OAuth client secret
#   CWS_REFRESH_TOKEN  OAuth refresh token from a one-time manual consent
#
# One-time consent to mint CWS_REFRESH_TOKEN (replace $CLIENT_ID):
#   open https://accounts.google.com/o/oauth2/auth?response_type=code&scope=https://www.googleapis.com/auth/chromewebstore&client_id=$CLIENT_ID&redirect_uri=urn:ietf:wg:oauth:2.0:oob
#   then exchange the code:
#   curl -d "client_id=$CLIENT_ID&client_secret=$SECRET&code=$CODE&grant_type=authorization_code&redirect_uri=urn:ietf:wg:oauth:2.0:oob" \
#     https://oauth2.googleapis.com/token

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only, skip store upload"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension package
        run: python3 scripts/validate.py

      - name: Build extension zip
        run: |
          python3 - <<'EOF'
          import zipfile
          from pathlib import Path
          root = Path(".")
          files = ["manifest.json", "DarkHacker.css", "LICENSE", "README.md"]
          files += [str(p) for p in sorted((root / "images").rglob("*")) if p.is_file()]
          with zipfile.ZipFile("darkhacker.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for f in files:
                  zf.write(f)
                  print("packed", f)
          EOF
          unzip -l darkhacker.zip

      - name: Upload and publish to Chrome Web Store
        if: ${{ inputs.dry_run == false }}
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.request

          def need(name):
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"missing required secret: {name}")
              return value

          publisher = need("CWS_PUBLISHER_ID")
          item = need("CWS_ITEM_ID")
          client_id = need("CWS_CLIENT_ID")
          client_secret = need("CWS_CLIENT_SECRET")
          refresh_token = need("CWS_REFRESH_TOKEN")

          token_req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=f"client_id={client_id}&client_secret={client_secret}"
                   f"&refresh_token={refresh_token}&grant_type=refresh_token".encode(),
          )
          access = json.load(urllib.request.urlopen(token_req))["access_token"]

          resource = f"publishers/{publisher}/items/{item}"
          blob = open("darkhacker.zip", "rb").read()
          upload_req = urllib.request.Request(
              f"https://chromewebstore.googleapis.com/upload/v2/{resource}",
              data=blob,
              headers={"Authorization": f"Bearer {access}", "Content-Type": "application/zip"},
              method="POST",
          )
          print("upload:", urllib.request.urlopen(upload_req).status)

          publish_req = urllib.request.Request(
              f"https://chromewebstore.googleapis.com/v2/{resource}:publish",
              data=json.dumps({}).encode(),
              headers={"Authorization": f"Bearer {access}", "Content-Type": "application/json"},
              method="POST",
          )
          print("publish:", json.load(urllib.request.urlopen(publish_req)))
          EOF
